# ######## Note ########
# Command to get window name for rules
# $ hyprctl clients
# ########     ########

# ######## Window rules ########

# windowrule = tile,^(Microsoft-edge)$
# windowrule = tile,^(Chromium)$
# windowrule = float on,^(blueman-manager)$
# windowrule = float on, ^(blueberry.py)$
# windowrule = float on,^(nm-connection-editor)$
# windowrule = float on,^(qalculate-gtk)$
# windowrule = float on, ^(steam)$
windowrule = match:float true,match:class ^(com.github.Aylur.ags)$
# windowrule = stay_focused, match:title ^()$,match:class ^(steam)$
windowrule = min_size 1 1, match:title ^()$,match:class ^(steam)$
# Disabled: this globally centered all floating windows and overrides per-window placement.
# windowrule = center 1,match:float true
windowrule=float on,match:title ^(Volume Control)(.*)$

# Dialogs
windowrule=float on,match:title ^(Open File)(.*)$
windowrule=float on,match:title ^(Select a File)(.*)$
windowrule=float on,match:title ^(Choose wallpaper)(.*)$
windowrule=float on,match:title ^(Open Folder)(.*)$
windowrule=float on,match:title ^(Save As)(.*)$
windowrule=float on,match:title ^(Library)(.*)$
windowrule=float on,match:title ^(File Upload)(.*)$

# Tearing
windowrule = immediate on,match:class .*\.exe
windowrule = immediate on,match:class (steam_app)455

# Xwaylandvideobridge (if installed)
windowrule = opacity 0.0 override,match:class ^(xwaylandvideobridge)$
windowrule = no_anim on,match:class ^(xwaylandvideobridge)$
windowrule = no_initial_focus on,match:class ^(xwaylandvideobridge)$
windowrule = max_size 1 1,match:class ^(xwaylandvideobridge)$
windowrule = no_blur on,match:class ^(xwaylandvideobridge)$

# ######## Layer rules ########
# layerrule = xray 1, .*
# layerrule = no_anim on, .*
# layerrule = no_anim on, walker
layerrule = no_anim on, match:namespace selection
layerrule = no_anim on, match:namespace overview
layerrule = no_anim on, match:namespace anyrun
layerrule = no_anim on, match:namespace popup.*
layerrule = no_anim on, match:namespace hyprpicker

layerrule = blur on, match:namespace gtk-layer-shell
# layerrule = ignorezero, gtk-layer-shell
layerrule = blur on, match:namespace launcher
layerrule = ignore_alpha 0.5, match:namespace launcher
layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0.69, match:namespace notifications

layerrule = no_anim on, match:namespace notifications

# ----------------------------------------------------- 
# Custom Window Rules
# ----------------------------------------------------- 
windowrule = opacity 0.98 0.9,match:class .*
windowrule = opacity 0.95 0.95,match:class ^(code)$
# windowrule = opacity 0.99 0.99,match:class ^(firefox)$
windowrule = opacity 0.97 0.97,match:float true
windowrule = opacity 0.6 0.6,match:float true,match:class ^(Chromium-browser)$
windowrule = opacity 1 1 1,match:float true,match:class ^(firefox)$
windowrule = opacity 1 1 1,match:float true,match:class ^(zen)$
windowrule = opacity 1 1 1,match:class ^(zen)$
windowrule = opacity 1 1 1,match:class ^(obs)$
windowrule = opacity 1 1 1,match:class ^(dota)$
windowrule = opacity 0.9 0.75,match:class ^(alacritty)$
windowrule = opacity 0.9 0.75,match:class ^(ghostty)$
# ----------------------------------------------------- 
# https://wiki.hyprland.org/Useful-Utilities/Screen-Sharing/
# ----------------------------------------------------- 
windowrule = opacity 0.0 override,match:class ^(xwaylandvideobridge)$
windowrule = no_anim on,match:class ^(xwaylandvideobridge)$
windowrule = no_initial_focus on,match:class ^(xwaylandvideobridge)$
windowrule = max_size 1 1,match:class ^(xwaylandvideobridge)$
windowrule = no_blur on,match:class ^(xwaylandvideobridge)$
windowrule = idle_inhibit fullscreen, match:class .*

# ----------------------------------------------------- 
# Associate Apps to Workspaces
# ----------------------------------------------------- 
windowrule = workspace 1,match:class ^(alacritty)$
windowrule = workspace 1,match:class ^(ghostty)$
windowrule = workspace 2,match:class ^(firefox)$
windowrule = workspace 2,match:class ^(zen-browser)$
windowrule = workspace 2,match:class ^(zen)$
windowrule = workspace 2,match:class ^(zen-beta)$
windowrule = workspace 3,match:class ^(code-url-handler)$
windowrule = workspace 3,match:class ^(code)$
windowrule = workspace 3,match:class ^(cursor)$
windowrule = workspace 4 silent,match:class ^(steam)$
windowrule = workspace 5,match:class ^(discord)$
windowrule = workspace 5,match:class ^(vencord)$
windowrule = workspace 4,match:class ^(lutris)$
windowrule = workspace 4,match:class ^(heroic)$
windowrule = workspace 1,match:title ^(Deadlock)$
windowrule = workspace 9,match:class ^(BaldursGate3)$
windowrule = workspace 9,match:class ^(piper)$
# windowrule = workspace 8,match:class ^(Spotify)$
windowrule = no_initial_focus on, match:title (^notificationtoasts.*)$
windowrule = no_focus on,match:class ^(steam)$,match:title ^(notificationtoasts_.*_desktop)$
windowrule = no_initial_focus on, match:title (^steam)$
misc{
   focus_on_activate = false
}
