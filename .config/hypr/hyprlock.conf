# Source color variables
source = ~/.config/hypr/conf/colors/everforest.conf

general {
  immediate_render = false
}

background {
  monitor =
  path = screenshot
  color = $background_rgba

  # see https://wiki.hyprland.org/Configuring/Variables/#blur for blur info
  blur_passes = 2 # 0 disables blurring
  # blur_size = 2
  # noise = 0
  # contrast = 0
  # brightness = 0
  # vibrancy = 0
  # vibrancy_darkness = 0.0
}

input-field {
  monitor =
  size = 300, 60
  outline_thickness = 0
  dots_size = 0.25 # Scale of input-field height, 0.2 - 0.8
  dots_spacing = 0.55 # Scale of dots' absolute size, 0.0 - 1.0
  dots_center = true
  dots_rounding = -1
  outer_color = $border_color_inactive_rgba
  inner_color = $background_rgba_transparent
  font_color = $accent_primary
  fade_on_empty = false
  placeholder_text = password # Text rendered in the input box when it's empty.
  hide_input = false
  check_color = $accent_primary
  fail_color = $accent_error # if authentication failed, changes outer_color and fail message color
  fail_text = $FAIL <b>($ATTEMPTS)</b> # can be set to empty
  fail_transition = 100 # transition time in ms between normal outer_color and fail_color
  capslock_color = -1
  numlock_color = -1
  bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
  invert_numlock = false # change color if numlock is off
  swap_font_color = false # see below
  position = 0, -468
  halign = center
  valign = center
}

label {
monitor = 
text = cmd[update:1000] echo "$(~/.config/hypr/scripts/hyprlock/song-status)"
color = $foreground_rgba_75
font_size = 14
font_family = SF Pro Text
position = 20, 512
halign = left
valign = center
}

label {
monitor =
text = cmd[update:1000] echo "$(~/.config/hypr/scripts/hyprlock/network-status)‎"
color = $foreground_rgba_75
font_size = 16
font_family = SF Pro Text
position = -35, 512
halign = right
valign = center
}

label {
monitor =
text = cmd[update:1000] echo "$(~/.config/hypr/scripts/hyprlock/layout-status)‎"
color = $foreground_rgba_75
font_size = 15
font_family = SF Pro Text
position = -60, 512
halign = right
valign = center
}

label {
monitor =
text = cmd[update:1000] echo "$(date +"%A, %B %d")"
color = $foreground_rgba_75
font_size = 20
font_family = SF Pro Display Bold
position = 0, 405
halign = center
valign = center
}

label {
monitor = 
text = cmd[update:1000] echo "$(date +"%H:%M")"
color = $foreground_rgba_75
font_size = 93
font_family = SF Pro Display Bold
position = 0, 310
halign = center
valign = center
}


label {
  monitor =
  text = Johnny
  color = $foreground_rgba_75
  font_size = 24
  font_family = SF Pro Display Bold
  position = 0, -407
  halign = center
  valign = center
}

image {
  monitor =
  path = ~/Pictures/avatar.jpg
  border_color = $border_color_active_hex
  border_size = 0
  size = 73
  rounding = -1
  rotate = 0
  reload_time = -1
  reload_cmd = 
  position = 0, -353
  halign = center
  valign = center
}

