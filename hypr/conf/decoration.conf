#include "colors/everforest.conf"

decoration {
    rounding = 2
    blur {
        enabled = false
    }
    active_opacity = 1
    inactive_opacity = 1
    fullscreen_opacity = 1

    # drop_shadow = true
    # shadow_range = 10
    # shadow_render_power = 3
    # col.shadow = 0x66000000

}

group {

    drag_into_group = true

    groupbar {
        enabled = true
        text_color = $border_color_active
        col.active = $background
        col.inactive = $accent_inactive
        scrolling  = true
        font_size = 10
    }
}
